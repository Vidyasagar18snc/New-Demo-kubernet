services:
  backend:
    build:
      context: ./backend
    image: demo-login-backend:v1
    environment:
      DEMO_LOGIN_EMAIL: demo@example.com
      DEMO_LOGIN_PASSWORD: Demo@123
    networks:
      default:
        aliases:
          - demo-backend
    ports:
       - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 5

  frontend:
    build:
      context: ./frontend
    image: demo-login-frontend:v1
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
