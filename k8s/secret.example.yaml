# OPTIONAL: Kubernetes Secret example.
#
# The ConfigMap (configmap.yaml) already supplies the demo credentials, so this
# Secret is NOT required for the demo to run. It is provided only to show how you
# would move sensitive values out of a ConfigMap in a real deployment.
#
# SAFE USAGE (do NOT commit real secrets to Git):
#   1. Copy this file to a local file that is git-ignored, for example k8s/secret.local.yaml.
#   2. Fill in real values as base64-encoded strings:
#        [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('demo@example.com'))
#        [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('Demo@123'))
#   3. Apply it:  kubectl apply -f k8s/secret.local.yaml
#   4. Reference it from the backend Deployment instead of the ConfigMap:
#        envFrom:
#          - secretRef:
#              name: demo-backend-secret
#
# In production prefer AWS Secrets Manager / SSM Parameter Store (for example the
# Secrets Store CSI Driver) over committing any secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: demo-backend-secret
  namespace: demospace
type: Opaque
stringData:
  DEMO_LOGIN_EMAIL: "REPLACE_ME"
  DEMO_LOGIN_PASSWORD: "REPLACE_ME"
